<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — WildSpace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="page-transition"></div>

  <!-- Corner wildcat -->
  <div class="corner-icon">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 4 L20 22 C14 24 10 30 10 37 C10 50 20 58 32 58 C44 58 54 50 54 37 C54 30 50 24 44 22 L56 4 L46 14 C42 10 37 8 32 8 C27 8 22 10 18 14 Z"/>
      <circle cx="24" cy="36" r="3" fill="white"/>
      <circle cx="40" cy="36" r="3" fill="white"/>
      <path d="M27 46 Q32 50 37 46" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Nav -->
  <nav class="nav">
    <a href="index.html" class="nav-logo" data-nav>
      <div class="nav-logo-icon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 4 L20 22 C14 24 10 30 10 37 C10 50 20 58 32 58 C44 58 54 50 54 37 C54 30 50 24 44 22 L56 4 L46 14 C42 10 37 8 32 8 C27 8 22 10 18 14 Z"/>
          <circle cx="24" cy="36" r="3" fill="white"/>
          <circle cx="40" cy="36" r="3" fill="white"/>
          <path d="M27 46 Q32 50 37 46" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="nav-logo-text">WildSpace</span>
    </a>
    <div class="nav-actions">
      <a href="register.html" class="nav-link" data-nav>Sign up</a>
    </div>
  </nav>

  <!-- Auth layout -->
  <main class="auth-wrapper">

    <div class="auth-header">
      <h1 class="auth-header-title">
        Wild<span class="rocket">S</span>pace
      </h1>
      <p class="auth-header-sub">developed by Ycia&amp;Rald Productions</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-card-title">Welcome to WildSpace</h2>
      <p class="auth-card-sub">Your productive study session starts here.</p>

      <form class="auth-form" data-dest="index.html" novalidate>

        <div class="field">
          <label for="email">Educational Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@university.edu"
            autocomplete="username"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <a href="#" class="forgot-link">Forgot password?</a>

        <button type="submit" class="btn-primary">Log-in</button>
      </form>

      <p class="auth-or">Or</p>
      <p class="auth-switch">
        Don't have an account?
        <a href="register.html" data-nav>Sign-up</a>
      </p>

      <!-- Social links -->
      <div class="social-row">
        <!-- Facebook -->
        <a href="#" class="social-icon" aria-label="Facebook">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>
        <!-- LinkedIn -->
        <a href="#" class="social-icon" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
        <!-- Instagram text -->
        <a href="#" class="social-icon" aria-label="Instagram" style="font-size:10px;letter-spacing:-0.5px;font-style:italic;font-family:Georgia,serif;">Ig</a>
        <!-- Gmail -->
        <a href="#" class="social-icon" aria-label="Gmail">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!-- book.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildSpace - Reservation</title>

    <link rel="stylesheet" href="../assets/css/book.css">
</head>
<body>

   <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link">About Us</a>
            </div>
            
            <div class="logo">
                <h1 class="logo-text">WildSpace</h1>
            </div>
            
            <div class="nav-right">
                <a href="#" class="nav-link">Reservation</a>
                <button class="cta-button nav-cta">Contact Us</button>
            </div>
        </div>
    </nav>

    <!-- BOOKING SECTION -->
    <section class="auth-section booking-section">

        <!-- LEFT SIDE IMAGE -->
        <div class="auth-left">
            <div class="auth-image-container">
                <img src="../../assets/images/bookimg.png" alt="Booking Image">
            </div>
        </div>

        <!-- RIGHT SIDE FORM -->
        <div class="auth-right">

            <div class="auth-form-container">

                <h1 class="auth-title">
                    Reserve your <span class="auth-title-bold">study</span> space
                </h1>

                <p class="auth-subtitle">
                    Book your seat now
                </p>

                <form class="auth-form" id="bookingForm">

                    <div class="form-group">
                        <input
                            type="date"
                            class="form-input"
                            id="bookingDate"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <select
                            class="form-input"
                            id="capacity"
                            required
                        >
                            <option value="">Select Capacity</option>
                            <option value="1">1 Person</option>
                            <option value="2">2 People</option>
                            <option value="3">3 People</option>
                            <option value="4">4 People</option>
                            <option value="5">5 People</option>
                            <option value="6">6 People</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <select
                            class="form-input"
                            id="timeSlot"
                            required
                        >
                            <option value="">Select Time Slot</option>
                            <option value="8AM - 10AM">8AM - 10AM</option>
                            <option value="10AM - 12PM">10AM - 12PM</option>
                            <option value="1PM - 3PM">1PM - 3PM</option>
                            <option value="3PM - 5PM">3PM - 5PM</option>
                        </select>
                    </div>

                    <button type="submit" class="auth-submit-button">
                        Book Now
                    </button>

                </form>

                <div class="auth-footer">

                    <p class="auth-footer-text">
                        Need help?
                        <a href="#" class="auth-link">Contact us</a>
                    </p>

                    <div class="social-links">
                        <a href="#" class="social-icon">f</a>
                        <a href="#" class="social-icon">in</a>
                        <a href="#" class="social-icon">📷</a>
                        <a href="#" class="social-icon">✉</a>
                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="../assets/js/book.js"></script>

</body>
</html>
